<!doctype html>
<html lang="ru">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  /><meta name="theme-color" content="#184f40" /><title>Нет сети · FINLAB Academy</title
  ><style>
    body {
      margin: 0;
      background: #f7f9f8;
      color: #23362c;
      font:
        16px/1.7 Arial,
        sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      max-width: 520px;
      padding: 30px;
    }
    h1 {
      line-height: 1.2;
      letter-spacing: -0.04em;
      font-size: 34px;
    }
    a {
      display: block;
      margin: 12px 0;
      color: #28654f;
    }
    p {
      color: #6c7d72;
    }
    small {
      letter-spacing: 0.12em;
    }
    button {
      border: 0;
      background: #28654f;
      color: white;
      border-radius: 8px;
      padding: 14px 20px;
      font: inherit;
      cursor: pointer;
    }
    li {
      overflow-wrap: anywhere;
    }
  </style>
  <main>
    <small>FINLAB ACADEMY</small>
    <h1>Связь прервалась.<br />Знания остаются.</h1>
    <p>
      Эта страница ещё не сохранена для офлайн-доступа. Уже загруженные публичные страницы можно
      открыть ниже. Для входа и синхронизации нужен интернет.
    </p>
    <ul id="pages"></ul>
    <button onclick="location.reload()">Попробовать снова</button><a href="/">На главную</a>
  </main>
  <script>
    if('caches'in window)caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('finlab-public-')).map(k=>caches.open(k).then(c=>c.keys()))))).then(groups=>{const paths=[...new Set(groups.flat().map(r=>new URL(r.url).pathname))].filter(p=>p==='/path'||p==='/lab'||p==='/library'||p.startsWith('/lesson/'));for(const path of paths){const li=document.createElement('li');const a=document.createElement('a');a.href=path;a.textContent=path.startsWith('/lesson/')?'Сохранённый урок: '+path.split('/').pop():({'/path':'Учебный путь','/lab':'Лаборатория','/library':'Библиотека'})[path];li.append(a);document.querySelector('#pages').append(li)}}).catch(()=>{});
  </script>
</html>
